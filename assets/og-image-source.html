<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: local("Space Grotesk");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    width: 300px;
    height: 158px;
    overflow: hidden;
  }
  body {
    width: 1200px;
    height: 630px;
    font-family: "Segoe UI", Inter, Arial, sans-serif;
    overflow: hidden;
    transform: scale(0.25);
    transform-origin: top left;
    background: linear-gradient(135deg, #3da372, #163e2b 70%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 90px;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute;
    top: -180px;
    right: -160px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 70%);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 48px;
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: rgba(255,255,255,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand span {
    color: #fff;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  h1 {
    color: #fff;
    font-size: 62px;
    font-weight: 700;
    line-height: 1.15;
    max-width: 920px;
    letter-spacing: -0.02em;
  }
  h1 em {
    font-style: normal;
    color: #b9f0d1;
  }
  p {
    color: rgba(255,255,255,0.82);
    font-size: 26px;
    margin-top: 26px;
    max-width: 780px;
  }
</style>
</head>
<body>
  <div class="brand">
    <span class="mark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 18V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-5 4Z" fill="#fff"/></svg>
    </span>
    <span>WhatsAgent AI</span>
  </div>
  <h1>Your WhatsApp, answered <em>24/7</em> — in your customers' language.</h1>
  <p>Answers &amp; sells, sends offers to your customer list, and gives your team one shared inbox — in Hindi, Gujarati &amp; English.</p>
</body>
</html>

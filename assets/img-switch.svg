<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 200" width="336" height="200">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e4da"/>
      <stop offset="1" stop-color="#cfc8ba"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0ee"/>
    </linearGradient>
    <linearGradient id="rocker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.55" stop-color="#f1f2f1"/>
      <stop offset="1" stop-color="#dcdfdd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2b2b25" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1c1c18" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- wall -->
  <rect width="336" height="200" fill="url(#wall)"/>
  <rect width="336" height="200" fill="#000" opacity="0.06"/>
  <ellipse cx="90" cy="40" rx="150" ry="90" fill="#fff" opacity="0.18"/>

  <!-- plate -->
  <g filter="url(#shadow)">
    <rect x="98" y="34" width="140" height="132" rx="10" fill="url(#plate)" stroke="#d6d9d6" stroke-width="1"/>
  </g>
  <rect x="106" y="42" width="124" height="116" rx="7" fill="none" stroke="#e3e6e3" stroke-width="1"/>

  <!-- rocker (pressed at bottom) -->
  <g filter="url(#soft)">
    <path d="M124 60 h88 a6 6 0 0 1 6 6 v70 a6 6 0 0 1 -6 6 h-88 a6 6 0 0 1 -6 -6 v-70 a6 6 0 0 1 6 -6 z" fill="url(#rocker)"/>
  </g>
  <path d="M118 100 h100 v36 a6 6 0 0 1 -6 6 h-88 a6 6 0 0 1 -6 -6 z" fill="#000" opacity="0.06"/>
  <line x1="120" y1="100" x2="216" y2="100" stroke="#c9cdc9" stroke-width="1"/>

  <!-- indicator -->
  <circle cx="168" cy="78" r="3.2" fill="#3da372"/>
  <circle cx="168" cy="78" r="6" fill="#3da372" opacity="0.18"/>

  <!-- rating text -->
  <text x="168" y="152" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7.5" fill="#8c918c" letter-spacing="0.6">16A  250V~</text>

  <!-- screws -->
  <circle cx="110" cy="46" r="2.6" fill="#cfd3cf"/>
  <circle cx="226" cy="46" r="2.6" fill="#cfd3cf"/>
  <circle cx="110" cy="154" r="2.6" fill="#cfd3cf"/>
  <circle cx="226" cy="154" r="2.6" fill="#cfd3cf"/>
</svg>
